<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>윤지의 할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>윤지의 할 일 목록</h1>
    <p class="subtitle">윤지의 할 일</p>

    <!-- 할 일 입력 폼 -->
    <form id="todo-form">
      <div class="meta-row">
        <input id="author-input" type="text" placeholder="이름 (선택)" autocomplete="off">
        <label class="due-label">
          마감
          <input id="due-input" type="datetime-local">
        </label>
      </div>
      <div class="input-row">
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" required>
        <button type="submit">추가</button>
      </div>
    </form>

    <!-- 저장이나 불러오기에 실패하면 여기에 오류가 표시됩니다 -->
    <p id="error-message" role="alert" hidden></p>

    <!-- 보기 고르기(전체·진행 중·완료)와 남은 할 일 개수 -->
    <div class="toolbar">
      <div class="filters" role="group" aria-label="할 일 보기">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
        <button type="button" data-filter="done" aria-pressed="false">완료</button>
      </div>
      <p id="remaining-count"></p>
    </div>

    <!-- 할 일이 여기에 표시됩니다 -->
    <ul id="todo-list"></ul>
    <p id="empty-message">불러오는 중…</p>
  </main>

  <!-- Supabase 도구 → 접속 정보 → 앱 순서로 불러옵니다 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
